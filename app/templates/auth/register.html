{% extends "base.html" %}
{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><i class="fas fa-book-open"></i><h1>LibraryOS</h1></div>
    <p class="auth-subtitle">Create your student account</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-icon"><i class="fas fa-user"></i>
          <input type="text" name="name" placeholder="Your full name" required>
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-icon"><i class="fas fa-envelope"></i>
          <input type="email" name="email" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-icon"><i class="fas fa-lock"></i>
          <input type="password" name="password" placeholder="Minimum 8 characters" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p class="auth-link">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
